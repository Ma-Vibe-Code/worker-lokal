basePath: /
definitions:
  model.HealthStatus:
    properties:
      active_streams:
        type: integer
      mqtt_connected:
        type: boolean
      status:
        type: string
      uptime:
        type: string
      worker_id:
        type: string
    type: object
  model.HealthStatusResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/model.HealthStatus'
      message:
        type: string
      meta:
        $ref: '#/definitions/model.MetaPagination'
      status:
        type: boolean
    type: object
  model.MetaPagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      totalData:
        type: integer
      totalPage:
        type: integer
    type: object
  model.ResponseError-string:
    properties:
      code:
        type: integer
      data:
        type: string
      message:
        type: string
      meta:
        $ref: '#/definitions/model.MetaPagination'
      path:
        type: string
      status:
        type: boolean
    type: object
info:
  contact: {}
  description: Local RTSP-to-MediaMTX Stream Relay Worker for Way Kambas Wildlife
    Surveillance System
  title: Worker Lokal RTSP Relay API
  version: "1.0"
paths:
  /api/v1/health:
    get:
      description: Returns operational metrics, active stream count, and MQTT connectivity
        status
      produces:
      - application/json
      responses:
        "200":
          description: Worker is healthy
          schema:
            $ref: '#/definitions/model.HealthStatusResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ResponseError-string'
      summary: Check worker health status
      tags:
      - Health
swagger: "2.0"
